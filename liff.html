<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT Payment</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; }
.header { background: #06C755; padding: 16px; text-align: center; }
.header h1 { color: #fff; font-size: 20px; }
.header p { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 4px; }
.container { padding: 16px; max-width: 480px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 14px; color: #555; margin-bottom: 12px; }
.preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.preset-btn { padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; cursor: pointer; font-size: 13px; text-align: center; }
.preset-btn.active { background: #06C755; color: #fff; border-color: #06C755; }
.divider { text-align: center; color: #aaa; font-size: 13px; margin: 12px 0; }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-wrap { position: relative; flex: 1; }
.input-wrap input { width: 100%; padding: 10px 36px 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.input-wrap span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 13px; }
.network-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
.network-btn { padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; cursor: pointer; text-align: left; }
.network-btn.active { border-color: #06C755; background: #f0fff4; }
.network-btn .net-name { font-size: 14px; font-weight: bold; color: #333; }
.network-btn .net-detail { font-size: 12px; color: #888; margin-top: 2px; }
.network-btn .net-spread { font-size: 12px; color: #06C755; float: right; }
.summary { background: #f9f9f9; border-radius: 8px; padding: 12px; margin-top: 12px; display: none; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.summary-row.total { border-top: 1px solid #eee; padding-top: 8px; margin-top: 4px; font-weight: bold; }
.summary-row.total span:last-child { color: #06C755; }
.qr-section { text-align: center; display: none; }
.qr-section h2 { font-size: 20px; color: #06C755; margin-bottom: 4px; }
.qr-section p { font-size: 13px; color: #888; margin-bottom: 16px; }
#qrcode { display: inline-block; margin-bottom: 16px; }
.wallet-box { background: #f5f5f5; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; text-align: left; }
.wallet-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.wallet-addr { font-size: 11px; color: #333; word-break: break-all; }
.network-warn { color: #ff5555; font-size: 12px; margin-bottom: 12px; }
.btn-confirm { width: 100%; padding: 14px; background: #06C755; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; opacity: 0.5; pointer-events: none; }
.btn-confirm.active { opacity: 1; pointer-events: auto; }
.btn-copy { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
.btn-back { width: 100%; padding: 12px; background: #f5f5f5; color: #333; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; cursor: pointer; }
.error { color: #ff5555; font-size: 12px; text-align: center; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="header">
  <h1>ชำระเงิน USDT</h1>
  <p id="rate-text">กำลังโหลด...</p>
</div>
<div class="container">

  <div id="page-amount">
    <div class="card">
      <h2>เลือกจำนวนเงิน (บาท)</h2>
      <div class="preset-grid">
        <button class="preset-btn" onclick="selectPreset(100)">100 THB</button>
        <button class="preset-btn" onclick="selectPreset(200)">200 THB</button>
        <button class="preset-btn" onclick="selectPreset(500)">500 THB</button>
        <button class="preset-btn" onclick="selectPreset(1000)">1,000 THB</button>
        <button class="preset-btn" onclick="selectPreset(2000)">2,000 THB</button>
        <button class="preset-btn" onclick="selectPreset(5000)">5,000 THB</button>
      </div>
      <div class="divider">หรือระบุจำนวนเอง</div>
      <div class="input-row">
        <div class="input-wrap">
          <input type="number" id="input-thb" placeholder="บาท" oninput="onInput('thb')">
          <span>฿</span>
        </div>
        <div style="color:#aaa;font-size:18px;">⇄</div>
        <div class="input-wrap">
          <input type="number" id="input-usdt" placeholder="USDT" oninput="onInput('usdt')">
          <span>U</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>เลือก Network</h2>
      <div class="network-grid" id="network-grid"></div>
    </div>

    <div class="summary" id="summary">
      <div class="summary-row"><span>จำนวนเงิน</span><span id="s-thb">-</span></div>
      <div class="summary-row"><span>Network</span><span id="s-network">-</span></div>
      <div class="summary-row"><span>Spread</span><span id="s-spread">-</span></div>
      <div class="summary-row"><span>อัตรา</span><span id="s-rate">-</span></div>
      <div class="summary-row total"><span>รวม USDT</span><span id="s-usdt">-</span></div>
    </div>
    <p class="error" id="error-msg">กรุณาระบุจำนวนเงินและเลือก Network</p>
    <button class="btn-confirm" id="btn-confirm" onclick="showQR()">ดู QR สำหรับชำระเงิน</button>
  </div>

  <div id="page-qr" style="display:none;">
    <div class="card qr-section" id="qr-card" style="display:block;">
      <h2 id="qr-usdt">0 USDT</h2>
      <p id="qr-thb">= 0 THB</p>
      <div id="qrcode"></div>
      <div class="wallet-box">
        <div class="wallet-label" id="qr-network">-</div>
        <div class="wallet-addr" id="qr-wallet">-</div>
      </div>
      <p class="network-warn" id="qr-warn">-</p>
      <button class="btn-copy" onclick="copyAddress()">คัดลอก Address</button>
      <button class="btn-back" onclick="goBack()">กลับ</button>
    </div>
  </div>

</div>
<script>
var mktRate = 33;
var ratesData = {};
var selectedThb = 0;
var selectedNetwork = '';

async function init() {
  try {
    await liff.init({ liffId: '2010018986-l6xlmcbu' });
  } catch(e) {}
  try {
    var res = await fetch('https://usdt-payment-q54z.onrender.com/rate');
    var data = await res.json();
    mktRate = data.mktRate;
    ratesData = data.rates;
    document.getElementById('rate-text').textContent = 'อัตราตลาด 1 USDT = ' + mktRate.toFixed(2) + ' THB';
    buildNetworkGrid();
  } catch(e) {
    document.getElementById('rate-text').textContent = '1 USDT = ' + mktRate.toFixed(2) + ' THB';
    buildNetworkGrid();
  }
}

function buildNetworkGrid() {
  var grid = document.getElementById('network-grid');
  grid.innerHTML = '';
  var keys = Object.keys(ratesData);
  if (keys.length === 0) {
    keys = ['trc20', 'bep20', 'polygon'];
    ratesData = {
      trc20: { name: 'TRC-20', chain: 'TRON', spread: 0.03, ourRate: mktRate * 0.96, wallet: '', warning: 'TRC-20 only' },
      bep20: { name: 'BEP-20', chain: 'BNB Smart Chain', spread: 0.03, ourRate: mktRate * 0.97, wallet: '', warning: 'BEP-20 only' },
      polygon: { name: 'Polygon', chain: 'Polygon Network', spread: 0.03, ourRate: mktRate * 0.97, wallet: '', warning: 'Polygon only' },
    };
  }
  keys.forEach(function(key) {
    var net = ratesData[key];
    var btn = document.createElement('button');
    btn.className = 'network-btn';
    btn.id = 'net-' + key;
    btn.onclick = function() { selectNetwork(key); };
    btn.innerHTML = '<span class="net-spread">spread ' + (net.spread * 100) + '%</span>' +
      '<div class="net-name">' + net.name + '</div>' +
      '<div class="net-detail">' + net.chain + ' · 1 USDT = ' + net.ourRate.toFixed(2) + ' THB</div>';
    grid.appendChild(btn);
  });
}

function selectPreset(thb) {
  document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  selectedThb = thb;
  document.getElementById('input-thb').value = thb;
  updateUSDT();
  updateSummary();
}

function onInput(from) {
  document.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active'); });
  if (from === 'thb') {
    selectedThb = parseFloat(document.getElementById('input-thb').value) || 0;
    updateUSDT();
  } else {
    var usdt = parseFloat(document.getElementById('input-usdt').value) || 0;
    var rate = selectedNetwork && ratesData[selectedNetwork] ? ratesData[selectedNetwork].ourRate : mktRate;
    selectedThb = usdt * rate;
    document.getElementById('input-thb').value = selectedThb > 0 ? selectedThb.toFixed(2) : '';
  }
  updateSummary();
}

function updateUSDT() {
  if (selectedThb > 0 && selectedNetwork && ratesData[selectedNetwork]) {
    document.getElementById('input-usdt').value = (selectedThb / ratesData[selectedNetwork].ourRate).toFixed(4);
  }
}

function selectNetwork(key) {
  selectedNetwork = key;
  document.querySelectorAll('.network-btn').forEach(function(b) { b.classList.remove('active'); });
  var btn = document.getElementById('net-' + key);
  if (btn) btn.classList.add('active');
  updateUSDT();
  updateSummary();
}

function updateSummary() {
  var summary = document.getElementById('summary');
  var btn = document.getElementById('btn-confirm');
  if (selectedThb >= 100 && selectedNetwork && ratesData[selectedNetwork]) {
    var net = ratesData[selectedNetwork];
    var usdt = (selectedThb / net.ourRate).toFixed(4);
    summary.style.display = 'block';
    document.getElementById('s-thb').textContent = selectedThb.toLocaleString('th-TH', {minimumFractionDigits:2}) + ' THB';
    document.getElementById('s-network').textContent = net.name + ' (' + net.chain + ')';
    document.getElementById('s-spread').textContent = (net.spread * 100) + '%';
    document.getElementById('s-rate').textContent = '1 USDT = ' + net.ourRate.toFixed(2) + ' THB';
    document.getElementById('s-usdt').textContent = usdt + ' USDT';
    btn.classList.add('active');
  } else {
    summary.style.display = 'none';
    btn.classList.remove('active');
  }
}

function showQR() {
  if (selectedThb < 100 || !selectedNetwork || !ratesData[selectedNetwork]) {
    document.getElementById('error-msg').style.display = 'block';
    return;
  }
  document.getElementById('error-msg').style.display = 'none';
  var net = ratesData[selectedNetwork];
  var usdt = (selectedThb / net.ourRate).toFixed(4);

  document.getElementById('page-amount').style.display = 'none';
  document.getElementById('page-qr').style.display = 'block';
  document.getElementById('qr-usdt').textContent = usdt + ' USDT';
  document.getElementById('qr-thb').textContent = '= ' + selectedThb.toLocaleString('th-TH') + ' THB';
  document.getElementById('qr-network').textContent = 'Network: ' + net.name + ' (' + net.chain + ')';
  document.getElementById('qr-wallet').textContent = net.wallet;
  document.getElementById('qr-warn').textContent = net.warning;

  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), { text: net.wallet, width: 200, height: 200 });
}

function copyAddress() {
  var addr = document.getElementById('qr-wallet').textContent;
  navigator.clipboard.writeText(addr).then(function() { alert('คัดลอก Address แล้ว!'); });
}

function goBack() {
  document.getElementById('page-qr').style.display = 'none';
  document.getElementById('page-amount').style.display = 'block';
}

init();
</script>
</body>
</html>
